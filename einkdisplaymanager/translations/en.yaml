configuration:
  lan_base_url:
    name: LAN base URL
    description: "Device origin including port, e.g. http://192.168.1.10:8098. Leave blank to set it in the management UI."
  storage_limit_mb:
    name: Media storage limit (MiB)
    description: "Maximum disk space for originals, thumbnails, and saved variants."
  allowed_networks:
    name: Allowed device networks
    description: "CIDR ranges permitted to fetch device images and settings. Restrict these to your frame network."
