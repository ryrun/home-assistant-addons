name: Trakt MCP checks
on:
  pull_request:
    paths: ['trakt-mcp/**', '.github/workflows/trakt-mcp.yml']
  push:
    paths: ['trakt-mcp/**', '.github/workflows/trakt-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r trakt-mcp/requirements-dev.txt
      - run: python -m pytest -q trakt-mcp/tests
      - run: python -m pip check
      - run: node --check trakt-mcp/web/status.js
      - run: python trakt-mcp/scripts/benchmark.py --movies 10000 --iterations 20
  containers:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build target image
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: docker buildx build --platform "$TARGET_PLATFORM" --load --tag trakt-mcp:test trakt-mcp
      - name: Start with persistent Supervisor-style options
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/trakt-data"
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'trakt-data', 'options.json').write_text(json.dumps({
              'trakt_client_id': 'ci-test-only', 'mcp_auth_token': 'x' * 48}))
          Path(os.environ['RUNNER_TEMP'], 'trakt-data', 'oauth.json').write_text(json.dumps({
              'access_token': 'ci-access-test-only', 'refresh_token': 'ci-refresh-test-only',
              'created_at': int(time.time()), 'expires_in': 3600,
              'client_id_hash': hashlib.sha256(b'ci-test-only').hexdigest()}))
          PY
          docker run -d --platform "$TARGET_PLATFORM" --memory=256m --cpus=1 --name trakt-smoke -p 127.0.0.1:18765:8765 -v "$RUNNER_TEMP/trakt-data:/data" trakt-mcp:test
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18765/health
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/mcp)" = 401
          docker exec trakt-smoke python -c "from pathlib import Path; s=Path('/proc/1/status').read_text(); assert 'Uid:\t10001\t10001\t10001\t10001' in s"
      - name: Check ingress listener isolation
        run: |
          docker exec trakt-smoke python -c "import urllib.request, urllib.error;
          try: urllib.request.urlopen('http://127.0.0.1:8099/api/stats'); raise AssertionError('Ingress allowed direct access')
          except urllib.error.HTTPError as error: assert error.code == 403"
          test "$(docker port trakt-smoke 8099/tcp 2>/dev/null || true)" = ""
      - name: Exercise real HTTP MCP transport
        run: |
          python -m pip install --require-hashes -r trakt-mcp/requirements.txt
          python trakt-mcp/scripts/container_smoke.py
      - name: Verify restart and private persistent cache
        run: |
          docker restart trakt-smoke
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18765/health
          docker exec trakt-smoke python -c "import json; from pathlib import Path; assert Path('/data/public-cache.sqlite3').stat().st_mode & 0o777 == 0o600; p=Path('/data/oauth.json'); assert p.stat().st_mode & 0o777 == 0o600; assert json.loads(p.read_text())['refresh_token'] == 'ci-refresh-test-only'"
          python trakt-mcp/scripts/container_smoke.py
      - name: Container logs
        if: always()
        run: docker logs trakt-smoke || true
      - name: Clean up
        if: always()
        run: docker rm --force trakt-smoke || true
